services:
  - type: web
    name: revive-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars: &shared
      - key: DATABASE_URL
        fromDatabase: {name: revive-ai-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: revive-ai-redis, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: deterministic
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RAZORPAY_USE_API
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MESSAGING_PROVIDER
        value: simulated
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SES_FROM_EMAIL
        sync: false
  - type: worker
    name: revive-ai-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=INFO
    envVars: *shared
  - type: web
    name: revive-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
  - type: redis
    name: revive-ai-redis
    ipAllowList: []
databases:
  - name: revive-ai-db
    databaseName: revive_ai
    user: revive
